name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Separate test app with external playback checks
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_NAME: MiruShin
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java (17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate .env (TMDB key)
        if: ${{ !inputs.diagnostic }}
        uses: ./.github/actions/generate-env
        with:
          tmdb-read-access-token: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          module-library-url: ${{ secrets.MODULE_LIBRARY_URL }}
          fanart-tv-api-key: ${{ secrets.FANART_TV_API_KEY }}

      - name: Set up Android release signing
        if: ${{ !inputs.diagnostic }}
        uses: ./.github/actions/android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Prepare diagnostic build without account secrets
        if: ${{ inputs.diagnostic }}
        run: |
          printf 'TMDB_READ_ACCESS_TOKEN=\nMODULE_LIBRARY_URL=\nFANART_TV_API_KEY=\n' > .env
          echo 'mirushinDiagnostic=true' >> android/gradle.properties
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/features/player/application/external_playback.dart lib/features/player/engine/external_player_engine.dart lib/features/player/engine/player_engine.dart lib/features/player/engine/media_kit_player_engine.dart lib/features/player/application/playback_controller.dart lib/features/player/presentation/player_page.dart lib/features/settings/presentation/settings_page.dart lib/app/app.dart test/external_playback_test.dart
          git diff -- lib test > formatting.patch

      - name: Sign diagnostic app with its separate development key
        if: ${{ inputs.diagnostic }}
        env:
          DIAGNOSTIC_SIGNING: ${{ secrets.MIRUSHIN_TV_SIGNING }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          from pathlib import Path
          signing = json.loads(os.environ['DIAGNOSTIC_SIGNING'])
          Path('android/app/mirushin-tv.p12').write_bytes(base64.b64decode(signing['keystore']))
          Path('android/key.properties').write_text(
              'storeFile=mirushin-tv.p12\nkeyAlias=mirushin-tv\n'
              + 'storePassword=' + signing['password'] + '\n'
              + 'keyPassword=' + signing['password'] + '\n')
          PY

      - name: Analyze and test diagnostic playback
        if: ${{ inputs.diagnostic }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test test/external_playback_test.dart test/playback_attempt_plan_test.dart test/auto_skip_test.dart test/player_settings_test.dart test/player_checkpoint_persistence_test.dart test/player_transport_smoothness_test.dart test/player_engine_capability_test.dart test/player_models_test.dart test/player_video_surface_test.dart

      - name: Prepare Android version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION="${VERSION_LINE%%+*}"
          PUBSPEC_BUILD="${VERSION_LINE#*+}"
          BUILD_NUMBER=$(($(date -u +%s) / 60))
          if [[ "$PUBSPEC_BUILD" =~ ^[0-9]+$ ]] && [ "$BUILD_NUMBER" -le "$PUBSPEC_BUILD" ]; then
            BUILD_NUMBER=$((PUBSPEC_BUILD + 1))
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building Android $VERSION+$BUILD_NUMBER"

      - name: Build APK (release)
        run: |
          EXTRA_ARGS=()
          if [ '${{ inputs.diagnostic }}' = 'true' ]; then
            EXTRA_ARGS+=(--target-platform android-arm)
          fi
          flutter build apk --release \
            --build-name "${{ steps.ver.outputs.version }}" \
            --build-number "${{ steps.ver.outputs.build_number }}" "${EXTRA_ARGS[@]}"

      - name: Rename APK to MiruShin-android-vX.Y.Z.apk
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SRC_APK=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "ERROR: no APK found in build/app/outputs/flutter-apk"
            exit 1
          fi
          VERSION="${{ steps.ver.outputs.version }}"
          DEST_APK="${APP_NAME}-android-v${VERSION}.apk"
          cp "$SRC_APK" "$DEST_APK"
          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: MiruShin-android
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Upload diagnostic formatting
        if: ${{ always() && inputs.diagnostic }}
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-formatting
          path: formatting.patch

      - name: Upload Android build diagnostics
        if: ${{ failure() && inputs.diagnostic }}
        uses: actions/upload-artifact@v6
        with:
          name: android-build-diagnostics
          path: |
            build/app/outputs/**/*.apk
            build/app/outputs/logs/**
